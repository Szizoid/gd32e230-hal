[package]
name = "gd32e2-hal"
version = "0.25.2"
edition = "2024"
authors = ["Szizoid"]
description = "HAL for the GD32E23x series (Cortex-M23), currently the GD32E230"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Szizoid/gd32e2-hal"
keywords = ["gd32", "gd32e230", "cortex-m", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc"]
exclude = [".cargo", ".gitignore", "docs", "rust-toolchain.toml"]

# A part has to be named here too, there being no default: docs.rs would otherwise
# build with `defmt` alone and stop at build.rs. It names the largest one — 48 pins
# and 64K, so every peripheral and every pad the series has — because every other
# part is a subset of it, and documenting a superset over-promises rather than hides.
[package.metadata.docs.rs]
default-target = "thumbv8m.base-none-eabi"
targets = []
features = ["defmt", "gd32e230c8xx"]

# The part being built for, one feature each, named after the part number with an
# `x` in the fields the code cannot see. The letter is the bonded pin count (F 20,
# E 24, G 28, K 32, C 48) and the digit the flash code (4 = 16K flash + 4K SRAM,
# 6 = 32K + 6K, 8 = 64K + 8K), so `gd32e230g8xx` covers every G8 part regardless of
# package and temperature grade.
#
# The 32-pin parts are the one place the package is spelled out: a QFN32 (`u`)
# carries VSS on its thermal pad and gives the two freed pins to PB2 and PB8, an
# LQFP32 (`t`) does not. Temperature never reaches the code, hence the trailing `x`.
#
# build.rs turns the choice into the memory sizes in `memory.x` and into the
# `chip_x4`/`x6`/`x8` and `pads_ge_*` cfg flags the source gates on: the AF map
# differs by flash code (datasheet Table 2-13/2-14 notes 1/2/3), the bonded pins by
# package. Mutually exclusive; exactly one must be enabled.
#
# No default on purpose: a default would be this crate assuming which part is on
# someone else's board, and a wrong pin map compiles quietly. Our own examples get
# theirs from the [dev-dependencies] entry below.
[features]
gd32e230f4xx = []
gd32e230f6xx = []
gd32e230f8xx = []
gd32e230e8xx = []
gd32e230g4xx = []
gd32e230g6xx = []
gd32e230g8xx = []
gd32e230k4tx = []
gd32e230k4ux = []
gd32e230k6tx = []
gd32e230k6ux = []
gd32e230k8tx = []
gd32e230k8ux = []
gd32e230c4xx = []
gd32e230c6xx = []
gd32e230c8xx = []

# Derives defmt::Format on the public enums so they can be logged. Off by
# default: a user who does not log with defmt should not pull the crate in.
defmt = ["dep:defmt", "embedded-hal/defmt-03", "fugit/defmt"]

[dependencies]
# Only ever named inside cfg_attr(feature = "defmt", ...), see [features].
defmt = { version = "1.1", optional = true }
# The library itself only calls cortex_m::asm::delay (adc.rs); the
# critical-section impl is an examples-only concern, see [dev-dependencies].
cortex-m = "0.7.7"
# Trait-only interface so portable drivers work against our Pin types.
embedded-hal = "1.0"
# Non-blocking serial traits, split out of embedded-hal since 1.0.
embedded-hal-nb = "1.0"
# Byte-stream traits over USART. embedded-hal has no serial traits of its own
# and points here for them; unlike embedded-hal-nb these are buffer-oriented
# and always blocking.
embedded-io = "0.7.1"
# nb::Result/Error, used by embedded-hal-nb's trait signatures.
nb = "1.0"
# PAC for the GD32E2 family: gd32e230 = our chip, rt = interrupt vectors,
# critical-section = safe interrupt-free register access.
gd32e2 = { version = "0.9.1", features = ["gd32e230", "rt", "critical-section"] }
# Integer-only time units: rates and durations as distinct kinds, with the
# scale carried in the type. Replaces the newtypes `time` used to define.
fugit = "0.4.0"
# Pastes identifiers together, which macro_rules! cannot do on its own: the
# flash page names (fmc.rs) are built from their numbers.
paste = "1.0"

# Needed only to link a runnable binary, i.e. examples/: the reset handler and
# vector table, a #[panic_handler], and an impl for the critical-section that
# gd32e2's `critical-section` feature requires. Cargo unifies features across
# dependency kinds, so naming cortex-m here just adds the impl feature on top of
# the plain dependency above.
[dev-dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
# Shares a peripheral between `main` and an interrupt handler: a
# `Mutex<RefCell<Option<T>>>` proves the borrow happens with interrupts masked,
# without which the two contexts could race on the same registers.
critical-section = "1.1"
# Logging for the examples: defmt keeps only a string index plus raw argument
# bytes on the target, defmt-rtt drains them into the RTT ring buffer that
# `probe-rs run` reads over SWD.
defmt = "1.1"
defmt-rtt = "1.3"
# The crate depending on itself is not a cycle: this entry applies to examples
# only, and it is the one way to build them with a feature of the library
# enabled. Without it the examples cannot log our own error types, and — since
# there is no default chip — would not know which part they are for either. This
# is also why plain `cargo build` needs the feature spelled out: it builds the
# library alone, where dev-dependencies do not apply (see the `lib` alias).
gd32e2-hal = { path = ".", features = ["defmt", "gd32e230k8ux"] }

# The only example tied to a part: its pins are bonded on the 48-pin package alone,
# so on anything else cargo skips it instead of failing on a missing pin. To compile
# it, point the dev-dependency above at `gd32e230c8xx`.
[[example]]
name = "spi1-word"
required-features = ["gd32e230c8xx"]

# Small, predictable binary. debug = true costs no flash — probe-rs only loads
# the loadable sections — and is what gives symbols to `probe-rs gdb`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
overflow-checks = false

[profile.dev]
opt-level = 1
